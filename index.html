<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0b">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>Trivium</title>
<style>
  :root { --k0: #e63946; --k1: #f4c430; --k2: #2f6fed; color-scheme: dark }
  * { margin: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none }
  body, dialog { background: #0b0b0b; color: #f5f5f5; font: 600 9vmin system-ui }
  main, dialog[open] { height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: space-evenly }
  dialog { width: 100vw; max-width: none; max-height: none; border: 0; padding: 0 }
  [hidden] { display: none !important }
  button, .dot { font: inherit; color: var(--k, inherit); background: none; border: .6vmin solid; border-radius: 50%; width: 30vmin; height: 30vmin }
  .dot.on { background: var(--k) }
  .row { display: flex; gap: 4vmin }
  .row .dot { width: 6vmin; height: 6vmin }
  #wait .dot { animation: pulse .6s infinite alternate } #wait .dot:nth-child(2) { animation-delay: .2s } #wait .dot:nth-child(3) { animation-delay: .4s }
  @keyframes pulse { to { opacity: .15 } }
  #note { position: fixed; top: 4vmin; inset-inline: 0; text-align: center }
  canvas { width: min(92vmin, 92dvh); image-rendering: pixelated }
  video { width: 100vw; height: 80dvh; object-fit: cover }
  input { font: inherit; width: 80vw; text-align: center; background: none; color: inherit; border: 0; border-bottom: .6vmin solid }
</style>

<output id="note"></output>

<main id="setup">
  <button class="dot" style="--k: var(--k0)" aria-label="add key 1"></button>
  <button class="dot" style="--k: var(--k1)" aria-label="add key 2"></button>
  <button class="dot" style="--k: var(--k2)" aria-label="add key 3"></button>
</main>

<main id="home" hidden>
  <div class="row" id="wait"><i class="dot" style="--k: var(--k0)"></i><i class="dot" style="--k: var(--k1)"></i><i class="dot" style="--k: var(--k2)"></i></div>
  <output id="sats" aria-label="balance in sats" hidden></output>
  <button id="recv" aria-label="receive">↓</button>
  <button id="send" aria-label="send">↑</button>
</main>

<dialog id="sheet">
  <canvas id="qr" hidden></canvas>
  <video id="cam" playsinline muted hidden></video>
  <input id="amt" inputmode="numeric" pattern="[0-9]*" aria-label="amount in sats" hidden>
  <button id="go" aria-label="confirm" hidden>↑</button>
  <div class="row" id="signed" aria-label="signatures" hidden>
    <i class="dot" style="--k: var(--k0)"></i><i class="dot" style="--k: var(--k1)"></i><i class="dot" style="--k: var(--k2)"></i>
  </div>
</dialog>

<script type="module" src="app.js"></script>
