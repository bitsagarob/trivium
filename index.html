<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#002b36">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>Trivium</title>
<style>
  /* Solarized dark (Ethan Schoonover, 2011): base03, base1, red, yellow, blue */
  :root { --bg: #002b36; --fg: #93a1a1; --k0: #dc322f; --k1: #b58900; --k2: #268bd2; color-scheme: dark }
  * { margin: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none }
  body, dialog { background: var(--bg); color: var(--fg); font: 600 9vmin system-ui }
  main { height: 100dvh; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; padding-bottom: max(14dvh, env(safe-area-inset-bottom)) }
  .top { flex: 1; display: flex; align-items: center }
  dialog[open] { width: 100vw; height: 100dvh; max-width: none; max-height: none; border: 0; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: space-evenly }
  [hidden] { display: none !important }
  .keys, .row { display: flex; gap: 6vmin }
  button, .dot { font: inherit; color: var(--k, inherit); background: none; border: .6vmin solid; border-radius: 50%; width: 25vmin; height: 25vmin }
  .dot.on { background: var(--k); color: var(--bg) }
  .row .dot { width: 8vmin; height: 8vmin; font-size: 5vmin; display: grid; place-items: center }
  #wait .dot { animation: pulse .6s infinite alternate } #wait .dot:nth-child(2) { animation-delay: .2s } #wait .dot:nth-child(3) { animation-delay: .4s }
  @keyframes pulse { to { opacity: .15 } }
  #note { position: fixed; top: 4vmin; inset-inline: 0; text-align: center }
  img { width: min(92vmin, 92dvh); image-rendering: pixelated }
  video { width: 100vw; height: 80dvh; object-fit: cover }
  input { font: inherit; width: 80vw; text-align: center; background: none; color: inherit; border: 0; border-bottom: .6vmin solid; outline: 0 }
</style>

<output id="note"></output>

<main id="setup">
  <div class="keys">
    <button class="dot" style="--k: var(--k0)" aria-label="add key 1">1</button>
    <button class="dot" style="--k: var(--k1)" aria-label="add key 2">2</button>
    <button class="dot" style="--k: var(--k2)" aria-label="add key 3">3</button>
  </div>
</main>

<main id="home" hidden>
  <div class="top">
    <div class="row" id="wait"><i class="dot" style="--k: var(--k0)"></i><i class="dot" style="--k: var(--k1)"></i><i class="dot" style="--k: var(--k2)"></i></div>
    <output id="sats" aria-label="balance in sats" hidden></output>
  </div>
  <div class="keys">
    <button id="recv" aria-label="receive">↓</button>
    <button id="send" aria-label="send">↑</button>
  </div>
</main>

<dialog id="sheet">
  <img id="qr" alt="" hidden>
  <video id="cam" playsinline muted hidden></video>
  <input id="amt" inputmode="numeric" pattern="[0-9]*" aria-label="amount in sats" hidden>
  <button id="go" aria-label="confirm" hidden>↑</button>
  <div class="row" id="signed" aria-label="signatures" hidden><i class="dot" style="--k: var(--k0)">1</i><i class="dot" style="--k: var(--k1)">2</i><i class="dot" style="--k: var(--k2)">3</i></div>
</dialog>

<script type="module" src="app.js"></script>
