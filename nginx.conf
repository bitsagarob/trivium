# trivium.bitsaga.be: the files in this repo, plus /rpc (mainnet) and /signet straight to Bitcoin Core.
# Core's rpcwhitelist limits the trivium user to 10 methods. The logins stay outside git, in
# /etc/nginx/trivium-auth.conf: map $uri $core_auth { /rpc "Basic ..."; /signet "Basic ..."; }
include /etc/nginx/trivium-auth.conf;
map $uri $core { /rpc 127.0.0.1:8332; /signet 127.0.0.1:38332; }
limit_conn_zone $server_name zone=trivium_core:1m;
limit_req_zone $binary_remote_addr zone=trivium_visitor:1m rate=2r/s;

server {
    listen 80;
    listen [::]:80;
    server_name trivium.bitsaga.be;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name trivium.bitsaga.be;
    ssl_certificate /etc/letsencrypt/live/trivium.bitsaga.be/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trivium.bitsaga.be/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    root /home/rob/apps/trivium;
    index index.html;

    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'" always;
    add_header Permissions-Policy "camera=(self)" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "no-cache" always;

    location / { limit_except GET { deny all; } try_files $uri $uri/ =404; }
    location ~ /\. { return 404; }

    location ~ ^/(rpc|signet)$ {
        limit_except POST { deny all; }
        limit_conn trivium_core 2;          # Core has 16 RPC threads; the Lightning nodes keep the rest
        limit_req zone=trivium_visitor burst=40 nodelay;
        client_max_body_size 64k;
        proxy_pass http://$core/;
        proxy_set_header Authorization $core_auth;
        proxy_read_timeout 300s;            # a mainnet scan takes about a minute
    }

    access_log /var/log/nginx/trivium.bitsaga.be.access.log combined;
    error_log /var/log/nginx/trivium.bitsaga.be.error.log;
}
